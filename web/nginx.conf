server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://server:3001;
        proxy_set_header Host $host;
        # Full match footage routinely exceeds 512 MB; nginx streams the body through
        # (multer writes to disk, no server-side buffering), so disable the size check.
        client_max_body_size 0;
        # uploads block for the entire synchronous analysis (audit measured 46 s clip -> 58.96 s);
        # nginx's default 60 s read timeout would return 504 on longer clips
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location /data/ {
        proxy_pass http://server:3001;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
